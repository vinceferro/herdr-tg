[package]
name = "kickoff-channel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Three commands, all discovered from `src/bin/`: `kickoff-channel` is the product, `herdr-tg` is
# compatibility for the units, scripts and humans that still invoke the former name, and
# `kickoff-door` is the loopback HTTP edge for the PWA — the one binary here that listens. All
# three enter the same `lib.rs` surface (`kickoff-door` calls `gateway::main`), so none of them
# can become a second product surface.
#
# Discovered rather than declared, deliberately. `nothing_inbound_can_start_a_process` refuses an
# explicit binary-target section anywhere in a member manifest, because a declared `path` can point
# a shipped program at a directory its scan never opens. Naming these three here would have bought
# nothing — they sit in `src/bin/`, which that scan already walks — at the cost of standing a
# security guard down. The file stem is the command name, so the names live beside the code.
#
# That guard matches the section name as plain text, so it fires on a mention as readily as on a
# declaration: this comment cannot spell the section it is describing.
default-run = "kickoff-channel"

[dependencies]
herdr-client = { path = "../herdr-client" }
# Every tokio feature this crate's own code uses is named HERE, and that is not tidiness: `net`,
# `io-util`, `sync` and `process` were all reaching it only because `herdr-client`, `reqwest` and
# `teloxide` happen to ask for them and cargo unifies features across the graph. `transport.rs`
# binds the Unix socket and splits a boxed stream (`net`, `io-util`); `hub.rs` and `summarize.rs`
# hold a `Mutex`, an `mpsc` and a `Semaphore` (`sync`); the plugin tests start `bun` (`process`).
# The day one of those dependencies changes its TLS stack or stops needing a socket, this crate
# would stop compiling for a reason nobody would look for in another crate's manifest.
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync", "process"] }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
tracing    = { workspace = true }
futures-core = { workspace = true }
tracing-subscriber = { workspace = true }
toml       = { workspace = true }
reqwest    = { workspace = true }
rustix     = { workspace = true }
ring       = { workspace = true }
subtle     = { workspace = true }
getrandom  = { workspace = true }
hub-proto  = { path = "../hub-proto" }

# SLICE 2 — Telegram. `default-features = false` is LOAD-BEARING, not stylistic: teloxide 0.17.0's
# default is ['native-tls','ctrlc_handler','teloxide-core/default'] and teloxide-core 0.13.0's default
# is ['native-tls'] -> reqwest/native-tls -> openssl-sys, i.e. a build-time C dependency and a runtime
# link against system libssl, which silently contradicts D1's single-binary thesis.
# Verified 2026-08-28 with this exact feature string: 222 packages, reqwest 0.12.28, rustls 0.23.43,
# ring 0.17.14 (not aws-lc-rs, which wants cmake/clang-bindgen on aarch64), webpki-roots 1.0.9,
# hyper 1.11.0 — and ZERO openssl / openssl-sys / native-tls / aws-lc-* / rustls-native-certs crates.
# h2 and encoding_rs are absent, so Bot API long-polling runs over HTTP/1.1 (fine for D7).
# Consequence for slice 4's hardened unit: webpki-roots is compiled in, so no /etc/ssl/certs access is
# needed; the flip side is that CA-root updates need a rebuild (escape hatch: rustls -> rustls-native-roots).
# Supply-chain facts for the decision log: 0.17.0 dates from 2025-07-11 (13 months stale), MSRV 1.82,
# and it pulls proc-macro-error2 v2.0.1 which cargo already flags future-incompatible.
teloxide = { version = "0.17.0", default-features = false, features = ["rustls", "ctrlc_handler", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }
# The summarizer tests stand up a real HTTP server on loopback and read back what was sent to it.
# What is under test is what this crate does with a REPLY — which responder answered, and whether
# the operator's pane text was already on the wire by then — and a hand-rolled stand-in for reqwest
# would prove nothing about that.
# `process` is dev-only: `the_real_plugin_and_the_real_hub_agree_on_the_wire` spawns the real bun
# bridge. The binary itself starts nothing, and this feature must not leak into it — the hub's whole
# posture is that it supervises nothing and spawns nothing.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
