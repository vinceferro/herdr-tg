[workspace]
resolver = "3"
members  = ["crates/herdr-client", "crates/herdr-tg", "crates/hub-proto"]

[workspace.package]
edition      = "2024"
rust-version = "1.85"          # edition 2024 and clap 4.6.6 both require 1.85; toolchain here is 1.98.0
license      = "MIT"
repository   = "https://github.com/vinceferro/herdr-tg"

[workspace.dependencies]
tokio        = { version = "1.53.1", default-features = false }
serde        = { version = "1.0.229", features = ["derive"] }
serde_json   = "1.0.151"
thiserror    = "2.0.20"
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
tracing      = "0.1.44"
anyhow       = "1.0.104"
clap         = { version = "4.6.6", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Already in the graph via teloxide; pinned here with the SAME rustls stack so a direct
# dependency adds no new TLS implementation and no C build dependency.
reqwest    = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
toml       = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
tempfile     = "3.27.0"
# "std" is NOT optional here despite looking like it: without it rustix has no `AsFd` impl for
# std::fs::File and no `From<Errno> for io::Error`. It compiled anyway for a while because the
# dev-dependency tempfile turns it on, so `cargo test` was green while `cargo build` would not have
# been — a feature-unification accident, and exactly the kind of thing that surfaces on the day
# someone builds a release.
# Already in the graph via tempfile; a direct dependency adds no new crate to the test build and
# no C build dependency. It is here for ONE call: an advisory lock on the state directory. The
# alternative — a pidfile created with O_EXCL — cannot be released by the kernel when a process is
# killed, so a SIGKILL would leave a lock nobody can clear from a phone.
rustix       = { version = "1.1.4", default-features = false, features = ["std", "fs", "net", "process"] }
# All three are ALREADY in the graph — ring and subtle via rustls, getrandom under it — so naming
# them directly adds no crate to the build and no C dependency. They are here for the enrolment
# secret and nothing else: 32 random bytes, a SHA-256 of them, and a comparison that does not leak
# how far it got. Hand-rolling any of those three is how a token check becomes a timing oracle.
ring         = "0.17.14"
subtle       = "2.6.1"
getrandom    = "0.4.3"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"    # keeps symbols: PLAN.md's failure table wants greppable backtraces
# NO panic = "abort": one panicking tokio task would kill the whole bridge, which interacts badly
# with the systemd Restart=always + StartLimitIntervalSec=0 posture, and breaks #[should_panic]
# under --release. Revisit at slice 4 with the unit in hand, as a deliberate call.
