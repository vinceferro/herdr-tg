# lefthook-kickoff.yml — kickoff's GENERIC gates, wired by `kickoff adopt` (stack-agnostic).
# The /adopt session ADDS the stack gates (typecheck · lint · test) for the detected stack
# to this file. It is YOURS (adopter-owned): edit freely; `kickoff eject` removes it.
#
# ── The Rust gates live HERE, not in the root lefthook.yml ────────────────────────────────────
# The hook runner emits root-lefthook.yml commands BEFORE `extends:` commands, so putting them in
# the root file would run a ~1.9 s clippy ahead of a 0.09 s secret scan. Root stays a bare
# `extends:`; `adopt-manifest.py` then treats it as pure wiring on `kickoff eject`.
#
# ── Why every cargo line carries `env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH"` ──────
# BOTH halves are load-bearing on this box, and each fails differently:
#   1. PATH=…  — `~/.cargo/bin` is NOT on an agent session's PATH here (`which -a cargo` finds only
#      mise shims). Without it the gate dies "cargo: not found" and reads as a broken hook.
#   2. env -u RUSTUP_TOOLCHAIN — `mise env` exports RUSTUP_TOOLCHAIN=stable from the GLOBAL
#      ~/.config/mise/config.toml, and that variable SILENTLY OVERRIDES rust-toolchain.toml in
#      every Rust repo on this machine. Without the `-u`, this repo's pinned channel/components
#      are inert and the gate is checking some other toolchain than the one the build declares.
# Do NOT add `--all-features`: our crates declare none today, and the day one declares a
# TLS-selecting feature it would link openssl into every clippy run.
#
# ── Known cost, written down rather than worked around ────────────────────────────────────────
# This runner ignores lefthook's `{staged_files}`, so the cargo gates run on the WORKING TREE, not
# the staged index: an unstaged, half-finished file anywhere in the repo blocks every commit.
# Workaround when that bites: `git stash -k`.
pre-commit:
  commands:
    secret-scan:
      run: bash .kickoff/bin/scan-secrets --staged
    rust-fmt:
      run: env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH" cargo fmt --all --check
    rust-clippy:
      run: env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH" cargo clippy --workspace --all-targets -- -D warnings
    # ── Why the FULL suite runs at COMMIT and not only at push ────────────────────────────────
    # It used to live only under pre-push. That put `tests/no_live_write_call_site.rs` — the one
    # machine check standing between D3's catastrophic failure and `main` — on the wrong side of
    # the line the coordinator actually crosses: it commits autonomously at every done-boundary
    # while the push is gated on the operator's explicit go. A reviewer demonstrated the gap by
    # planting a reachable `client.send_text(&pane, …)` inside `cmd/watch.rs::run()`: fmt rc=0,
    # clippy rc=0, commit allowed, and only `git push` would ever have caught it. "Machine-checked"
    # and "the gates run on every commit" were each true and jointly false.
    #
    # WHOLE SUITE rather than just that one test, measured on this box rather than guessed:
    #   after editing two source files   clippy 0.34 s · that test alone 1.28 s · whole suite 1.51 s
    #   fully warm                                     · that test alone 0.32 s · whole suite 0.57 s
    # The dominant cost is compiling herdr-client and LINKING a test binary, which the single-test
    # form already pays in full. +0.23 s buys every other invariant — schema_drift, wire, golden,
    # failure_paths, events — instead of one, and removes the standing judgement call about which
    # tests are load-bearing enough to gate on. That judgement call is what opened this hole.
    #
    # It stays under pre-push too (below), deliberately: pre-push is the last check before code
    # leaves the machine, it costs ~0.5 s there, and it still fires for anything committed with
    # LEFTHOOK=0. Note both are WORKING-TREE checks — see the `{staged_files}` caveat above.
    rust-test:
      run: env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH" cargo test --workspace
    # ── Why `cargo doc` is a gate, added 2026-08-28 ───────────────────────────────────────────
    # A reviewer found `cargo doc` RED under `-D warnings` with two `private_intra_doc_links`
    # errors: public docs linking to the deliberately-`pub(crate)` `ReadSource`. Fixing the two
    # links was a one-line change. Making it a GATE is the part worth writing down, because of how
    # the fix went: within the same session, the agent that fixed those two links reintroduced the
    # identical error in a NEW doc comment — one whose whole subject was that this class of link is
    # an error — by linking to the `pub(crate)` `Handshake::evaluate`. `cargo doc` caught it; three
    # code reviews and a human would not have.
    #
    # The failure mode this really guards is worse than a broken doc build. The tempting way to
    # silence `private_intra_doc_links` is to widen the private item to `pub`, and the two items
    # involved here are `ReadSource` (whose `pub(crate)`-ness is the compiler-enforced reason no
    # timer can reach the harvest-scrolling `recent` source) and `Handshake::evaluate`. A gate that
    # goes red at commit time makes the wrong fix a deliberate act rather than a quiet convenience.
    #
    # Measured on this box, not guessed: 451 ms after a source edit, 38 ms fully warm — against the
    # 1.51 s `cargo test --workspace` already sitting above it. Same working-tree caveat as the
    # rest of the cargo gates.
    rust-doc:
      run: env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH" RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
pre-push:
  commands:
    structure-scan:
      run: bash .kickoff/bin/scan-structure
    rust-test:
      run: env -u RUSTUP_TOOLCHAIN PATH="$HOME/.cargo/bin:$PATH" cargo test --workspace
